/* Static art and audio now stream as independent files; no huge base64 payload on the JS thread. */
const TAU = Math.PI * 2;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
class FlightCore {
    constructor(seed = 0x28bf77e7) {
        this.worldWidth = 720;
        this.designHeight = 1280;
        this.phase = 'title';
        this.motion = 'flight';
        this.pilot = { x: -200, y: -65, vx: 0, vy: 275 };
        this.planets = [];
        this.shards = [];
        this.hazards = [];
        this.events = [];
        this.score = 0;
        this.distance = 0;
        this.combo = 0;
        this.perfectStreak = 0;
        this.bestCombo = 0;
        this.shield = 3;
        this.surge = 0;
        this.phaseShield = 0;
        this.lastGrade = null;
        this.lastKind = null;
        this.held = false;
        this.orbitPlanetId = -1;
        this.orbitAngle = 0;
        this.orbitRadius = 120;
        this.orbitSeconds = 0;
        this.orbitCharge = 0;
        this.orbitOmega = 3.25;
        this.runtime = 0;
        this.airSeconds = 0;
        this.cameraY = 0;
        this.speed = 275;
        this.nextPlanetId = 1;
        this.nextShardId = 1;
        this.nextHazardId = 1;
        this.furthestPlanetY = 0;
        this.lastPlanetX = -100;
        this.lastPlanetY = 85;
        this.historyY = -65;
        this.lastCaptureY = -65;
        this.eventStop = 0;
        this.seed = seed >>> 0;
        this.rng = this.seed;
        this.prepare();
    }
    rand() {
        // Predictable xorshift32, no runtime assets or platform API required.
        let x = this.rng;
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        this.rng = x >>> 0;
        return this.rng / 0x100000000;

    emit(type, x, y, extra = {}) {
        this.events.push({ type, x, y, ...extra });

    makePlanet(x, y, kind, radius) {

        this.planets.push(p);
        // Gem arcs are near the orbital ribbon, not randomly dotted in empty space.
        for (let i = 0; i < 5; i++) {

            const rr = radius + 79 + (i % 2) * 9;
            this.shards.push({

    }
    prepare() {
        this.rng = this.seed;
        this.phase = 'title';
        this.motion = 'flight';
        this.pilot = { x: -200, y: -65, vx: 0, vy: 275 };
        this.planets = [];
        this.shards = [];
        this.hazards = [];
        this.events = [];
        this.score = this.distance = this.combo = this.perfectStreak = this.bestCombo = 0;
        this.shield = 3;
        this.surge = this.phaseShield = 0;
        this.lastGrade = this.lastKind = null;
        this.held = false;
        this.orbitPlanetId = -1;
        this.orbitAngle = 0;
        this.orbitRadius = 120;
        this.orbitSeconds = this.orbitCharge = 0;
        this.orbitOmega = 3.25;
        this.runtime = this.airSeconds = 0;
        this.cameraY = this.pilot.y + 260;
        this.speed = 275;
        this.nextPlanetId = this.nextShardId = this.nextHazardId = 1;
        this.lastPlanetX = -100;
        this.lastPlanetY = 85;
        this.historyY = this.lastCaptureY = -65;
        this.eventStop = 0;
        this.makePlanet(-100, 85, 'gold', 49);
        this.furthestPlanetY = 85;
        this.generateUntil(2350);
    }
    start(seed) {
        if (typeof seed === 'number')

        this.prepare();
        this.phase = 'playing';
        this.emit('start', this.pilot.x, this.pilot.y);
    }
    resetTitle() { this.prepare(); }
    generateUntil(y) {
        const kinds = ['blue', 'gold', 'violet', 'blue', 'teal', 'gold', 'violet'];
        while (this.furthestPlanetY < y) {
            const idx = this.nextPlanetId - 1;
            const gap = 455 + this.rand() * 95;
            const swing = (this.rand() - 0.5) * 292;
            // Every planet can be reached by one decent launch; no impossible jumps.
            const nextX = clamp(this.lastPlanetX + swing, -225, 225);
            const nextY = this.lastPlanetY + gap;
            const kind = kinds[(idx + Math.floor(this.rand() * 3)) % kinds.length];
            const r = 43 + Math.round(this.rand() * 17);
            this.makePlanet(nextX, nextY, kind, r);
            if (idx >= 4 && idx % 3 === 0) {
                const hx = clamp((nextX + this.lastPlanetX) * 0.5 + (this.rand() - 0.5) * 200, -265, 265);
                this.hazards.push({ id: this.nextHazardId++, x: hx, y: nextY - 190, radius: 27, alive: true });
            }
            this.lastPlanetX = nextX;
            this.lastPlanetY = nextY;
            this.furthestPlanetY = nextY;
        }
    }
    targetInReach() {
        let target = null;
        let best = Infinity;
        for (const p of this.planets) {
            if (p.used)
                continue;
            const dd = d2(this.pilot, p);
            const max = 270 + (this.phaseShield > 0 ? 25 : 0);
            if (dd < max * max && dd < best) {
                target = p;
                best = dd;
            }
        }
        return target;
    }
    /** Every contact in flight now has an immediate action, even between stars. */
    nextAhead() {
        let selected = null;
        let best = Infinity;
        for (const p of this.planets) {
            if (p.used)
                continue;
            const dy = p.y - this.pilot.y;
            if (dy < -140 || dy > 1400)
                continue;
            const priority = Math.abs(dy) + Math.abs(p.x - this.pilot.x) * 0.25 + (dy < 0 ? 360 : 0);
            if (priority < best) {
                best = priority;
                selected = p;
            }
        }
        return selected;
    }
    pushTowardNext() {
        const target = this.nextAhead();
        const dy = target ? Math.max(0, target.y - this.pilot.y) : 500;
        const upward = clamp(350 + dy * 0.55, 525, 745);
        this.pilot.vy = Math.max(this.pilot.vy, upward);
        if (target) {
            const vx = clamp((target.x - this.pilot.x) * 1.10, -350, 350);
            this.pilot.vx = lerp(this.pilot.vx, vx, 0.60);
        }
        // Rapid taps should not expire in midair before the next gravitational catch.
        this.airSeconds = Math.min(this.airSeconds, 1.05);
        this.emit('boost', this.pilot.x, this.pilot.y);
    }
    press() {
        if (this.phase !== 'playing')
            return;
        this.held = true;
        if (this.motion === 'flight') {
            const target = this.targetInReach();
            if (target)
                this.capture(target);
            else
                this.pushTowardNext();
        }
    }
    capture(p) {
        p.used = true;
        p.turns += 1;
        this.motion = 'orbit';
        this.orbitPlanetId = p.id;
        this.orbitAngle = Math.atan2(this.pilot.y - p.y, this.pilot.x - p.x);
        this.orbitRadius = Math.hypot(this.pilot.x - p.x, this.pilot.y - p.y);
        this.orbitCharge = this.orbitSeconds = 0;
        this.orbitOmega = 3.1 * (p.kind === 'blue' ? 1.23 : 1);
        this.lastKind = p.kind;
        this.lastCaptureY = this.pilot.y;
        this.airSeconds = 0;
        this.emit('capture', p.x, p.y, { kind: p.kind });
    }
    get currentPlanet() {
        return this.planets.find((p) => p.id === this.orbitPlanetId) || null;
    }
    get launchAlignment() {
        // Counterclockwise tangent is (-sin(angle), cos(angle)).
        return Math.cos(this.orbitAngle);
    }
    get perfectWindow() {
        return this.motion === 'orbit' && this.launchAlignment > 0.86 && this.orbitCharge >= 0.68;
    }
    release() {
        this.held = false;
        if (this.phase !== 'playing' || this.motion !== 'orbit')
            return;
        const star = this.currentPlanet;
        if (!star) {
            this.motion = 'flight';
            return;
        }
        const alignment = this.launchAlignment;
        const tx = -Math.sin(this.orbitAngle);
        const ty = Math.cos(this.orbitAngle);
        const powered = this.orbitCharge >= 0.68;
        let grade = 'rough';
        if (alignment >= 0.86 && powered)
            grade = 'perfect';
        else if (alignment >= 0.30)
            grade = 'good';
        const kindBoost = star.kind === 'gold' ? 1.17 : star.kind === 'blue' ? 1.07 : 1;
        const chargedBoost = lerp(0.72, 1.08, this.orbitCharge);
        const mult = (this.surge > 0 ? 1.25 : 1) * kindBoost * chargedBoost;
        const baseSpeed = grade === 'perfect' ? 770 : grade === 'good' ? 650 : 490;
        const impulse = baseSpeed * mult;
        this.pilot.vx = tx * impulse * (grade === 'rough' ? 0.73 : 0.8);
        this.pilot.vy = grade === 'rough' ? Math.max(540, ty * impulse * 0.72 + 135) : Math.max(430, ty * impulse + 120);
        // Quick taps must still travel to the next star instead of dying after one launch.
        // Holding for the bright arc remains the way to earn PERFECT and the highest speed.
        if (grade === 'rough') {
            const next = this.nextAhead();
            if (next)
                this.pilot.vx = lerp(this.pilot.vx, clamp((next.x - this.pilot.x) * 1.15, -340, 340), 0.70);
        }
        // A fast release is still steerable on a narrow portrait phone.
        if (this.pilot.x > 210 && this.pilot.vx > 0)
            this.pilot.vx *= 0.40;
        if (this.pilot.x < -210 && this.pilot.vx < 0)
            this.pilot.vx *= 0.40;
        const value = grade === 'perfect' ? 420 : grade === 'good' ? 200 : 60;
        if (grade === 'perfect') {
            this.combo += 1;
            this.perfectStreak += 1;
            if (star.kind === 'teal')
                this.shield = Math.min(3, this.shield + 1);
            if (this.perfectStreak >= 5) {
                this.perfectStreak = 0;
                this.surge = 4;
                this.phaseShield = Math.max(this.phaseShield, 2.2);
                this.shield = Math.min(3, this.shield + 1);
                this.emit('burst', this.pilot.x, this.pilot.y);
            }
        }
        else if (grade === 'good') {
            this.combo += 1;
            this.perfectStreak = 0;
        }
        else {
            this.combo = this.perfectStreak = 0;
        }
        if (star.kind === 'violet')
            this.phaseShield = Math.max(this.phaseShield, 1.8);
        this.bestCombo = Math.max(this.bestCombo, this.combo);
        this.score += Math.floor(value * (1 + Math.min(this.combo, 15) * 0.17) * (this.surge > 0 ? 2 : 1));
        this.lastGrade = grade;
        this.motion = 'flight';
        this.orbitPlanetId = -1;
        this.airSeconds = 0;
        this.emit('launch', this.pilot.x, this.pilot.y, { grade, kind: star.kind, value });
    }
    step(delta) {
        if (this.phase !== 'playing')
            return;
        // Keep integrator deterministic and stable after mobile background/resume.
        const frames = Math.max(1, Math.ceil(clamp(delta, 0, 0.12) / 0.018));
        const dt = clamp(delta, 0, 0.12) / frames;
        for (let i = 0; i < frames && this.phase === 'playing'; i++)
            this.advance(dt);
    }
    advance(dt) {
        this.runtime += dt;
        this.surge = Math.max(0, this.surge - dt);
        this.phaseShield = Math.max(0, this.phaseShield - dt);
        this.eventStop = Math.max(0, this.eventStop - dt);
        if (this.motion === 'orbit') {
            const p = this.currentPlanet;
            if (p) {
                this.orbitSeconds += dt;
                this.orbitCharge = clamp(this.orbitSeconds / (p.kind === 'blue' ? 0.48 : 0.58), 0, 1);
                this.orbitOmega = (3.05 + Math.min(0.48, this.orbitSeconds * 0.18)) * (p.kind === 'blue' ? 1.23 : 1);
                this.orbitAngle += this.orbitOmega * dt;
                const desired = p.radius + 82;
                this.orbitRadius = lerp(this.orbitRadius, desired, 1 - Math.exp(-9 * dt));
                this.pilot.x = p.x + Math.cos(this.orbitAngle) * this.orbitRadius;
                this.pilot.y = p.y + Math.sin(this.orbitAngle) * this.orbitRadius;
                this.pilot.vx = -Math.sin(this.orbitAngle) * this.orbitRadius * this.orbitOmega;
                this.pilot.vy = Math.cos(this.orbitAngle) * this.orbitRadius * this.orbitOmega;
                if (this.orbitSeconds > 4.0)
                    this.end(); // missed the launch window; no auto-play loop
            }
        }
        else {
            this.airSeconds += dt;
            this.pilot.x += this.pilot.vx * dt;
            this.pilot.y += this.pilot.vy * dt;
            this.pilot.vx *= Math.exp(-0.38 * dt);
            this.pilot.vy -= (this.airSeconds > 1.0 ? 115 : 20) * dt;
            // A nearby star captures the pilot automatically. Touch is never ignored
            // merely because the user released the screen while travelling.
            const nearby = this.targetInReach();
            if (nearby)
                this.capture(nearby);
            if (this.motion === 'flight' && this.held) {
                const target = this.targetInReach();
                if (target)
                    this.capture(target);
                else {
                    // Holding ahead of a star slowly bends the line towards its gravity field.
                    const next = this.planets.find((p) => !p.used && p.y > this.pilot.y - 30 && p.y < this.pilot.y + 540);
                    if (next)
                        this.pilot.vx += clamp((next.x - this.pilot.x) * 1.8, -165, 165) * dt;
                }
            }
            if (this.pilot.x > 332) {
                this.pilot.x = 332;
                this.pilot.vx = -Math.max(50, Math.abs(this.pilot.vx) * 0.72);
                this.emit('wall', 332, this.pilot.y);
            }
            if (this.pilot.x < -332) {
                this.pilot.x = -332;
                this.pilot.vx = Math.max(50, Math.abs(this.pilot.vx) * 0.72);
                this.emit('wall', -332, this.pilot.y);
            }
            if (this.airSeconds > 5.2 || (this.airSeconds > 1.65 && this.pilot.vy <= 40)) {
                this.end();
            }
        }
        this.speed = Math.hypot(this.pilot.vx, this.pilot.vy);
        this.historyY = Math.max(this.historyY, this.pilot.y);
        this.distance = Math.max(0, Math.floor((this.historyY + 65) / 12));
        this.score += Math.max(0, this.pilot.vy) * dt * (this.surge > 0 ? 0.26 : 0.12);
        // Keep the camera responsive but not jittery during orbits.
        const wanted = Math.max(-65 + 260, this.pilot.y + 260);
        this.cameraY = lerp(this.cameraY, wanted, 1 - Math.exp(-5.5 * dt));
        this.generateUntil(this.pilot.y + 2300);
        for (const s of this.shards) {
            if (!s.taken && d2(this.pilot, s) <= 42 * 42) {
                s.taken = true;
                this.score += this.surge > 0 ? 90 : 45;
                this.emit('pickup', s.x, s.y, { value: 45 });
            }
        }
        for (const h of this.hazards) {
            if (!h.alive)
                continue;
            if (d2(this.pilot, h) < (h.radius + 21) ** 2) {
                h.alive = false;
                if (this.phaseShield > 0 || this.surge > 0) {
                    this.score += 120;
                    this.emit('burst', h.x, h.y);
                }
                else {
                    this.shield -= 1;
                    this.combo = this.perfectStreak = 0;
                    this.phaseShield = 1.5;
                    this.emit('hit', h.x, h.y);
                    if (this.shield <= 0)
                        this.end();
                }
            }
        }
        // Bound memory and draw calls on long endless sessions.
        const cutoff = this.pilot.y - 1250;
        if (this.planets.length > 20)
            this.planets = this.planets.filter((p) => p.y >= cutoff);
        if (this.shards.length > 100)
            this.shards = this.shards.filter((s) => !s.taken && s.y >= cutoff);
        if (this.hazards.length > 36)
            this.hazards = this.hazards.filter((h) => h.alive && h.y >= cutoff);
    }
    end() {
        if (this.phase !== 'playing')
            return;
        this.phase = 'over';
        this.held = false;
        this.emit('over', this.pilot.x, this.pilot.y);
    }
    takeEvents() {
        const all = this.events;
        this.events = [];
        return all;
    }
}
// This browser harness shares the EXACT FlightCore.ts rules with Cocos Creator.
// Rendering differs intentionally: Creator uses cc.Sprite, cc.Graphics, cc.Label.
const RESOURCE_BASE = './assets/';
const ASSET_OVERRIDES = {};
const url = (name, audio = false) => ASSET_OVERRIDES[name] || (RESOURCE_BASE + (audio ? 'audio/' : 'art/') + name + (audio ? '.mp3' : name === 'space' ? '.jpg' : '.png'));
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true}) || canvas.getContext('2d');
const soundButton = document.getElementById('mute');
const core = new FlightCore();
let vh=1280, scale=1, last=performance.now(), clock=0, fx=[], trail=[], flash='', flashUntil=0, shake=0;

// The game must NEVER require storage to render or accept input.
const safeStore = {
 get(key){ try { return window.localStorage.getItem(key) } catch (_) { return null } },
 set(key,value){ try { window.localStorage.setItem(key,String(value)) } catch (_) { /* ephemeral in restricted viewers */ } }
};
let best=Number(safeStore.get('fly-galaxy-best') || 0);
let bestDistance=Number(safeStore.get('fly-galaxy-distance') || 0);
let muted=safeStore.get('fly-galaxy-mute')==='1';
let musicUnlocked=false;
let isPointerDown=false;
let firstPressAt=0;
let audioInitDone=false;
const images={}, audios={};
const imagesNames=['space','planet_gold','planet_blue','planet_violet','planet_teal','pilot','shard','hazard'];
for(const k of imagesNames){const i=new Image();i.decoding='async';i.src=url(k);images[k]=i;}
// Do not construct or play Audio objects in the first touch handler. On iOS,
// decoding base64 MP3s at first gesture used to monopolize the render thread.
function initAudio(){
  if(audioInitDone)return;
  audioInitDone=true;
  for(const k of ['bgm','capture','launch','perfect','pickup','hit','burst','over']){
    const a=new Audio();a.preload=k==='bgm'?'auto':'metadata';
    a.src=url(k,true);a.volume=k==='bgm'?.26:.46;a.loop=k==='bgm';audios[k]=a;
  }
}
// Warm media players while the title screen is idle; avoid competing with gameplay.
setTimeout(()=>{if(core.phase==='title')initAudio()},900);
soundButton.textContent=muted?'♪̸':'♫';
const stars=Array.from({length:62},(_,i)=>{
  const r=(n)=>((Math.sin(n*128.2+61.4)*43758.5453)%1+1)%1;
  return {x:(r(i+.3)-.5)*710,y:r(i+23.7)*2100,sz:.5+r(i+17.3)*1.6,tw:r(i+3.9)*6.3};
});

function resize(){
  const w=window.innerWidth, h=window.innerHeight;
  const ratio=(w>620)?Math.min(460/w,820/h):1;
  const cw=w*ratio,ch=h*ratio;
  canvas.style.width=cw+'px';canvas.style.height=ch+'px';
  const dpr=Math.min(1.5,window.devicePixelRatio||1); // Cap iOS backing buffer below 0.8M pixels on typical phones
  canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);
  scale=canvas.width/720;vh=canvas.height/scale;

window.addEventListener('resize',resize);resize();

  if(muted || performance.now()-firstPressAt<1100)return;
  const a=audios[key];if(!a || a.readyState<2)return;
  try{if(!a.paused)a.currentTime=0;a.volume=Math.min(1,(key==='bgm'?.26:.46)*vol);a.play().catch(()=>{});}catch(_){}
}
function music(){
  if(muted || !musicUnlocked)return;
  const a=audios.bgm;if(!a || a.readyState<2)return;
  if(a.paused)a.play().catch(()=>{});
}
soundButton.addEventListener('pointerdown',e=>e.stopPropagation());
soundButton.addEventListener('click',e=>{
 e.preventDefault();e.stopPropagation();muted=!muted;
 soundButton.textContent=muted?'♪̸':'♫';safeStore.set('fly-galaxy-mute',muted?'1':'0');
 if(!audioInitDone)initAudio();
 if(muted){if(audios.bgm)audios.bgm.pause()}else{musicUnlocked=true;music()}
});
// Safari and embedded iOS browsers can lose pointerup/capture. Listen to touch
// events as well, deduplicate the same gesture and recover after cancellation.
let physicalDownAt=0;
let touchIdentifier=null;
let inputPressCount=0;
let inputReleaseCount=0;
function press(){
 if(isPointerDown)return;
 isPointerDown=true;
 physicalDownAt=performance.now();
 inputPressCount++;
 if(core.phase!=='playing'){
  core.start();fx=[];trail=[];flash='';
  firstPressAt=performance.now();
  if(!audioInitDone)setTimeout(initAudio,1550);
 }
 core.press();consume();
 if(core.runtime>1.1 && audioInitDone){musicUnlocked=true;music()}
}
function release(){
 if(!isPointerDown)return;
 isPointerDown=false;
 touchIdentifier=null;
 inputReleaseCount++;
 core.release();consume();
 if(core.runtime>1.1 && audioInitDone){musicUnlocked=true;music()}
}
function pointerStart(e){
 e.preventDefault();
 // A stale press must not block every subsequent tap.
 if(isPointerDown && (touchIdentifier===null || performance.now()-physicalDownAt>1250))release();
 if(!isPointerDown){
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  press();
 }
}
canvas.addEventListener('pointerdown',pointerStart);
window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'||touchIdentifier===null)release()});
window.addEventListener('pointercancel',release);
canvas.addEventListener('lostpointercapture',e=>{if(e.pointerType!=='touch')release()});
// Always register touch events, even when PointerEvent exists (iOS Safari).
canvas.addEventListener('touchstart',e=>{
 e.preventDefault();
 if(!e.changedTouches.length)return;
 if(isPointerDown && touchIdentifier!==null && !Array.from(e.touches).some(t=>t.identifier===touchIdentifier))release();
 if(isPointerDown && performance.now()-physicalDownAt>1250)release();
 if(!isPointerDown){touchIdentifier=e.changedTouches[0].identifier;press()}
 else if(touchIdentifier===null)touchIdentifier=e.changedTouches[0].identifier;
},{passive:false});
window.addEventListener('touchend',e=>{
 if(!isPointerDown)return;
 if(touchIdentifier!==null){
  for(const t of e.changedTouches){if(t.identifier===touchIdentifier){release();break}}

},{passive:false});
window.addEventListener('touchcancel',release,{passive:false});
// Older browsers without PointerEvent still accept mouse clicks.
if(!('PointerEvent' in window)){

}
window.addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();press()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release()}});

function explode(ev,count=15,hue=0){
 for(let i=0;i<count;i++){
  const a=i*2.399963 + core.runtime;
  const speed=90+(i%8)*(hue===1?46:18);
  const life=.27+(i%5)*.13;
  fx.push({x:ev.x,y:ev.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life,max:life,r:2+i%3,hue:hue===2?2:i%4===0?1:0});
 }
 if(fx.length>96)fx=fx.slice(-96);
}
function consume(){
 for(const ev of core.takeEvents()){
  if(ev.type==='boost'){explode(ev,10);flash='引力推进';flashUntil=clock+.28;}
  else if(ev.type==='capture'){play('capture',.75);explode(ev,13)}
  else if(ev.type==='launch'){
   play('launch');explode(ev,ev.grade==='perfect'?23:16,1);
   flash=ev.grade==='perfect'?'PERFECT!':ev.grade==='good'?'NICE!':'继续飞!';
   flashUntil=clock+.82;
   if(ev.grade==='perfect')play('perfect',.75);
  }else if(ev.type==='pickup'){play('pickup',.43);explode(ev,8)}
  else if(ev.type==='hit'){play('hit');explode(ev,28,2);shake=.19}
  else if(ev.type==='wall')explode(ev,8)
  else if(ev.type==='burst'){
   play('burst');explode(ev,28,1);flash='银河潮汐 ×2';flashUntil=clock+1.3;shake=.2;
  }else if(ev.type==='over'){
    play('over');
    best=Math.max(best,Math.floor(core.score));bestDistance=Math.max(bestDistance,core.distance);
    safeStore.set('fly-galaxy-best',String(best));
    safeStore.set('fly-galaxy-distance',String(bestDistance));
  }
 }
}
function circle(x,y,r,color,fill=true,lw=1){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
 if(fill){ctx.fillStyle=color;ctx.fill()}else{ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke()}
}
function txt(s,x,y,size,color='#fff',align='center',weight=600,shadow=false){
 ctx.save();ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${weight} ${size}px system-ui, -apple-system, 'PingFang SC', sans-serif`;
 if(shadow){ctx.shadowColor='#36d7ff';ctx.shadowBlur=24}
 ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();
}
function drawArt(k,x,y,w,h=w,angle=0){
 const img=images[k];if(!img?.complete||!img.naturalWidth)return;
 ctx.save();ctx.translate(x,y);if(angle)ctx.rotate(angle);
 ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}
function render(){
 const C=core;const cy=C.cameraY;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#030918';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(scale,0,0,scale,canvas.width/2,canvas.height/2);
 const Y=y=>-(y-cy);
 // Background is real original art shipped inside resources, with screen-safe cover.
 drawArt('space',0,Math.sin(clock*.13)*8,720,vh+110);
 if(C.surge>0){ctx.fillStyle=`rgba(88,30,108,${Math.min(.21,C.surge*.06)})`;ctx.fillRect(-360,-vh/2,720,vh)}
 for(let i=0;i<stars.length;i++){
   const s=stars[i];const yy=(((s.y-cy*.15+1100)%2100+2100)%2100)-1100;
   const a=.2+.32*(.5+.5*Math.sin(clock*1.2+s.tw));
   circle(s.x,yy,s.sz,`rgba(174,219,251,${a.toFixed(2)})`);
 }
 // Orbit ribbons communicate both charge state and release-timing window.
 for(const p of C.planets){
  const y=Y(p.y);if(y>vh/2+250||y< -vh/2-250)continue;
  const c={gold:'255,194,114',blue:'112,227,251',violet:'218,151,255',teal:'131,251,203'}[p.kind];
  circle(p.x,y,p.radius+82,`rgba(${c},${p.used?.13:.43})`,false,2);
  if(!p.used){
    ctx.beginPath();ctx.arc(p.x,y,p.radius+82,-.51,.51);
    ctx.lineWidth=9;ctx.strokeStyle='rgba(255,196,107,.17)';ctx.stroke();
    ctx.lineWidth=3.3;ctx.strokeStyle='rgba(255,235,169,.8)';ctx.stroke();
  }
  drawArt('planet_'+p.kind,p.x,y,p.radius*3.88);
 }
 if(C.motion==='orbit'&&C.currentPlanet){
  const p=C.currentPlanet,y=Y(p.y);
  ctx.beginPath();ctx.arc(p.x,y,C.orbitRadius,-.51,.51);
  ctx.lineWidth=C.perfectWindow?8:4;
  ctx.strokeStyle=C.perfectWindow?'#fff1a2':'#65e7fa';ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,y,p.radius+18,-Math.PI/2,-Math.PI/2+C.orbitCharge*Math.PI*2);
  ctx.lineWidth=4;ctx.strokeStyle='#8afaff';ctx.stroke();
 }
 for(const s of C.shards){if(s.taken)continue;const y=Y(s.y);if(y< -vh/2-60||y>vh/2+60)continue;
  const z=35*(.94+.12*Math.sin(clock*4+s.id));drawArt('shard',s.x,y,z,z,clock*.7+s.id);
 }
 for(const h of C.hazards){if(!h.alive)continue;const y=Y(h.y);if(y< -vh/2-90||y>vh/2+90)continue;
  drawArt('hazard',h.x,y,h.radius*4.1,h.radius*4.1,clock*.55+h.id);
 }
 if(trail.length>1){
  for(let pass=0;pass<2;pass++){
   for(let i=trail.length-1;i>=1;i--){
    ctx.strokeStyle=C.surge>0?`rgba(212,132,255,${(1-i/trail.length)*(pass?.72:.18)})`:`rgba(86,230,250,${(1-i/trail.length)*(pass?.82:.20)})`;
    ctx.lineWidth=pass?3:17;ctx.beginPath();ctx.moveTo(trail[i].x,Y(trail[i].y));ctx.lineTo(trail[i-1].x,Y(trail[i-1].y));ctx.stroke();
   }
  }
 }
 const px=C.pilot.x+(shake>0?Math.sin(clock*72)*shake*15:0),py=Y(C.pilot.y);
 if(C.phaseShield>0||C.surge>0){
  circle(px,py,46+Math.sin(clock*8)*3,C.surge>0?'rgba(225,128,255,.66)':'rgba(126,246,255,.65)',false,3);
 }
 drawArt('pilot',px,py,C.surge>0?132:112,C.surge>0?158:134,Math.atan2(C.pilot.vx,C.pilot.vy));
 for(const f of fx){
  const a=Math.max(0,f.life/f.max);
  circle(f.x,Y(f.y),Math.max(.3,f.r*a),f.hue===2?`rgba(255,95,157,${a})`:f.hue===1?`rgba(242,163,255,${a})`:`rgba(109,244,251,${a})`);
 }
 const top=-vh/2;
 const grd=ctx.createLinearGradient(0,top,0,top+230);grd.addColorStop(0,'rgba(3,9,22,.83)');grd.addColorStop(1,'rgba(3,9,22,0)');
 ctx.fillStyle=grd;ctx.fillRect(-360,top,720,230);
 if(C.phase==='playing'){
  txt('SCORE',-247,top+105,19,'#a3d7ee','center',500);
  txt(Math.floor(C.score).toString().padStart(6,'0'),-212,top+152,43,'#fff');
  txt('DISTANCE',236,top+105,19,'#b5d5e9','center',500);
  txt(C.distance+' m',236,top+151,31,'#ffdfb4');
  txt('◆ '.repeat(C.shield),-225,top+221,24,'#84edf6');
  txt(Math.floor(C.speed)+' km/s',239,top+221,21,'#c6dcf4');
  if(C.combo>1)txt('连击  × '+C.combo,0,top+265,29,'#ffe2a3');
  if(C.surge>0)txt('银河潮汐  ×2',0,top+316,25,'#d7a0ff');
  if(clock<flashUntil)txt(flash,0,-100,58,flash==='PERFECT!'?'#fff2b2':'#8eebf9','center',800,true);
  const prompt=C.motion==='orbit'?(C.perfectWindow?'现在松手  ·  PERFECT!':'按住蓄能  ·  等待亮弧'):(C.held?'接近星球，自动捕获引力':'轻点推进  ·  接近星球自动捕获');
  txt(prompt,0,vh/2-116,27,C.perfectWindow?'#fff0a2':'#bee8f7');
  txt(C.motion==='orbit'?'精 准 时 机':'按 住 / 松 开',0,vh/2-76,16,'#6b99b9','center',450);
 } else {
  // Title and game-over are deliberately drawn in the same view as the live game.
  ctx.fillStyle='rgba(2,8,21,.72)';ctx.fillRect(-360,top,720,vh);
  const btop=-174;
  ctx.fillStyle='rgba(15,54,76,.84)';rounded(-303,btop-108,606,455,45,true);
  ctx.strokeStyle='rgba(104,194,233,.33)';ctx.lineWidth=2;rounded(-303,btop-108,606,455,45,false);
  const buttonY=155;
  const button=ctx.createLinearGradient(0,buttonY-51,0,buttonY+51);
  button.addColorStop(0,'#52d8e5');button.addColorStop(1,'#137f9e');
  ctx.fillStyle=button;rounded(-245,buttonY-49,490,98,43,true);
  ctx.strokeStyle='#a1f8fd';ctx.lineWidth=3;rounded(-245,buttonY-49,490,98,43,false);
  if(C.phase==='title'){
   txt('飞吧银河系！',0,-vh*.28,70,'#fff2d6','center',800,true);
   txt('用一根手指，把速度甩到宇宙尽头。',0,-vh*.28+75,24,'#bce2f0');
   txt('轻点推进  ·  按住蓄力  ·  松手弹射',0,-101,35,'#fff6df');
   txt('进入亮弧时松手，触发 PERFECT 连击',0,-38,22,'#c5e8f9','center',500);
   txt('连续五次精准弹射，释放银河潮汐',0,2,22,'#c5e8f9','center',500);
   txt('触摸屏幕开始',0,buttonY,37,'#ffffff');
  }else{
   txt('本次飞行结束',0,-vh*.28,65,'#fff1d8','center',800,true);
   txt('下一次，接住更远的星星。',0,-vh*.28+75,25,'#c0e1ed');
   txt(Math.floor(C.score).toLocaleString()+' 分',0,-99,46,'#ffedc1');
   txt('飞行 '+C.distance+'m   ·   最高连击 ×'+C.bestCombo,0,-20,25,'#c7e6f8');
   txt('再飞一次',0,buttonY,37,'#fff');
  }
  txt('个人最佳 '+best.toLocaleString()+' 分   ·   最远 '+bestDistance+' m',0,257,23,'#a9d1e6');
 }
}
function rounded(x,y,w,h,r,fill){
 ctx.beginPath();
 if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r)}
 else {const q=Math.min(r,w*.5,h*.5);ctx.moveTo(x+q,y);ctx.lineTo(x+w-q,y);ctx.quadraticCurveTo(x+w,y,x+w,y+q);ctx.lineTo(x+w,y+h-q);ctx.quadraticCurveTo(x+w,y+h,x+w-q,y+h);ctx.lineTo(x+q,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-q);ctx.lineTo(x,y+q);ctx.quadraticCurveTo(x,y,x+q,y);ctx.closePath()}
 if(fill)ctx.fill();else ctx.stroke();
}
let drawnFirstFrame=false;
const targetFrameMs = 1000/30;
let lastDrawAt=0;
// Optional diagnostics: add ?perf=1 to the URL. Never visible in normal play.
const showPerf=/(?:^|[?&])perf=1(?:&|$)/.test(location.search);
let fpsCounter=0,fpsWindowAt=0,fpsValue=0;
const fpsInfo=showPerf?document.createElement('div'):null;
if(fpsInfo){fpsInfo.style.cssText='position:fixed;z-index:5;top:30px;left:12px;color:#fff;font:13px monospace;text-shadow:0 1px 4px #000;pointer-events:none';document.body.appendChild(fpsInfo)}
function showFatal(err){
 console.error('[FLY-GALAXY] runtime error',err);
 document.documentElement.classList.remove('ready');
 document.documentElement.classList.add('error');
 const boot=document.getElementById('boot');
 boot.querySelector('.sub').textContent='游戏画面初始化失败';
 boot.querySelector('.hint').textContent='错误：'+String(err && err.message || err).slice(0,200);
}
function tick(now){
 try {
  // Safari usually schedules rAF at 60Hz: render on alternate frames.
  // Guard first frame and fallback to 30Hz on 120Hz devices as well.
  if(lastDrawAt && now-lastDrawAt<targetFrameMs-2){requestAnimationFrame(tick);return}
  const dt=Math.min(.065,Math.max(0,(now-last)/1000));last=now;lastDrawAt=now;clock+=dt;
  if(core.phase==='playing'){
    core.step(dt);consume();
    trail.unshift({x:core.pilot.x,y:core.pilot.y});if(trail.length>22)trail.pop();
    for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.exp(-3*dt);f.vy*=Math.exp(-3*dt);f.life-=dt;}
    fx=fx.filter(f=>f.life>0);
  }
  shake=Math.max(0,shake-dt);
  render();
  if(!drawnFirstFrame){drawnFirstFrame=true;document.documentElement.classList.add('ready')}
  if(showPerf){fpsCounter++;if(now-fpsWindowAt>=1000){fpsValue=Math.round(fpsCounter*1000/(now-fpsWindowAt));fpsCounter=0;fpsWindowAt=now}fpsInfo.textContent='FPS '+fpsValue+' / '+core.motion+' / '+Math.round(core.runtime*10)/10+'s / DOWN '+inputPressCount+' UP '+inputReleaseCount}
  requestAnimationFrame(tick);
 } catch(err){showFatal(err)}
}
requestAnimationFrame(tick);
